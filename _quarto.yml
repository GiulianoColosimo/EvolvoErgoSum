project:
  type: website
  output-dir: docs # allows publishing from /docs on GitHub Pages
  # Colosimo_CV_english.pdf is not linked from any page (the navbar CV link
  # points at Proton Drive), but it has been published at
  # /EvolvoErgoSum/documents/ for years — keep that URL alive.
  resources:
    - documents/
    # GitHub Pages writes docs/CNAME when you set the custom domain, but
    # `quarto render` wipes docs/ — which would silently drop the domain.
    # Keeping CNAME in the project root and listing it here re-copies it
    # into docs/ on every render.
    - CNAME
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "temp/**/*.qmd"
    # Reads ~/Dropbox/iguanas/.../TCI_MasterDB.xlsx, which is not in the repo,
    # so it can only be rendered on a machine where that Dropbox is mounted.
    # Remove this line there to rebuild the page.
    - "!temp/road_mortality_model/**"

website:

  title: "Evolvo Ergo Sum"
  reader-mode: true
  page-navigation: true
  description: "Ecology, Evolution with a sprinkle of Technology"
  site-url: https://www.giulianocolosimo.com
  favicon: "./figures/avatar.jpg"

  repo-url: https://github.com/GiulianoColosimo/EvolvoErgoSum
  repo-actions: [edit, issue]

  google-analytics:
    tracking-id: "UA-24215497"
  open-graph:
    locale: en_US
  twitter-card: true

  navbar:
    search: true
    pinned: false
    right:
      - text: "Bio"
        href: aboutme.qmd
      - text: "Research"
        menu:
          - href: research.qmd
            text: "Overview"
          - href: taco.qmd
            text: "T. A. Co."
          - href: macra.qmd
            text: "M.A.C.R.A."
      - text: "Publications"
        href: publications.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Now"
        href: now.qmd
      - text: "Photos"
        href: photos.qmd
      - text: "Contacts"
        href: contacts.qmd
      - text: "CV"
        href: documents/Colosimo_CV.pdf
      - icon: github
        href: "https://github.com/GiulianoColosimo"
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS feed

  page-footer:
    left: "© 2026 Giuliano Colosimo"
    center:
      - text: "Bio"
        href: aboutme.qmd
      - text: "Research"
        href: research.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Contacts"
        href: contacts.qmd
    right: "Built with ❤️, [Quarto](https://quarto.org/), and some coding tips from Claude. Design inspired by [Cynthia Huang](https://www.cynthiahqy.com/)."

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
